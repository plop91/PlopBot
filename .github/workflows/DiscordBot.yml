# Lints the bot and publishes a Docker image.
# For more information see: https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-python

name: DiscordBot

on:
  push:
  pull_request:

# Only what the jobs actually need
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # checks out code from repository
      - uses: actions/checkout@v7

      # Matches the Dockerfile (python:3.11-slim). Note the bot uses builtin
      # generics in annotations, so it will not import on anything below 3.9.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      # NOTE: not able to test ffmpeg install
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Runs automatically once a tests/ directory exists
      - name: Test with pytest
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -q
          else
            echo "No tests/ directory yet, skipping."
          fi

  docker:
    runs-on: ubuntu-latest
    # Do not publish an image built from code that does not even parse
    needs: build
    # Pushes only: pull requests and forks have no access to the Docker Hub secrets
    if: github.event_name == 'push' && github.repository == 'plop91/PlopBot'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: plop91/plop_discord
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

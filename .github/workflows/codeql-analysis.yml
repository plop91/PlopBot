# CodeQL security analysis.
# https://docs.github.com/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning

name: "CodeQL"

on:
  push:
  pull_request:
  schedule:
    - cron: '23 1 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
        # CodeQL supports a lot more than this, see
        # https://docs.github.com/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Initializes the CodeQL tools for scanning.
      # build-mode "none" is required for interpreted languages such as Python;
      # it replaces the old Autobuild step, which did nothing useful here.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # To use custom queries, uncomment and point at your own:
          # queries: ./path/to/local/query, your-org/your-repo/queries@main

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

version: '3.8'

services:
  plopbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: plopbot:latest
    container_name: plopbot
    restart: unless-stopped

    # Mount volumes for persistent data
    volumes:
      - ./soundboard:/app/soundboard
      - ./info:/app/info
      - ./voices:/app/voices
      - ./youtube:/app/youtube

    # Environment variables (optional - can override settings)
    environment:
      # Override CONFIG_FILE to use a different config (default: info/info.json)
      - CONFIG_FILE=info/info.json
      # For development, use:
      # - CONFIG_FILE=info/testinginfo.json

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

